<!doctype html>
<html><head><meta charset="utf-8">
<!-- Counter sign for a shop display: 4 x 6 in portrait for a standard acrylic
     sign holder. Page is 4.25 x 6.25 in: 1/8 in bleed on every side.
     Render: node render.js (Playwright page.pdf plus a PNG preview). -->
<style>
@font-face{font-family:'Bebas Neue';src:url(src/bebas.woff2)}
@font-face{font-family:'Playfair Display';font-style:italic;src:url(src/playfair-italic.woff2)}
@page{size:4.25in 6.25in;margin:0}
html,body{margin:0}
body{width:4.25in;height:6.25in;background:#0D9488;color:#fff;font-family:'Bebas Neue',sans-serif;position:relative;overflow:hidden}
/* safe area: 1/8 in bleed + 1/8 in margin */
.safe{position:absolute;inset:0.3in;display:flex;flex-direction:column}
.brand{font-size:15pt;letter-spacing:6pt;text-align:center}
h1{margin:6pt 0 0;font-weight:400;line-height:.86;text-align:center}
h1 .a{display:block;font-size:32pt;letter-spacing:3pt}
h1 .b{display:block;font-size:68pt;color:#FFD24A}
h1 .c{display:block;font-size:32pt;letter-spacing:3pt}
.sub{font-family:'Playfair Display',serif;font-style:italic;font-size:14pt;text-align:center;margin-top:8pt}
.art{position:relative;flex:none;height:1.95in;margin-top:8pt;margin-bottom:8pt}
.box{position:absolute;left:0.55in;top:0.02in;height:1.88in;box-shadow:0 8pt 14pt rgba(0,0,0,.35);border-radius:2pt}
.card{position:absolute;width:0.86in;height:1.72in;border-radius:7pt;overflow:hidden;box-shadow:0 6pt 12pt rgba(0,0,0,.35)}
.card img{position:absolute;width:113.7%;left:-6.85%;top:-3.5%}
.c1{left:1.6in;top:0.1in;transform:rotate(-4deg)}
.c2{left:2.15in;top:0.14in;transform:rotate(9deg)}
.foot{display:flex;align-items:center;gap:10pt;flex:none}
.qr{background:#fff;padding:5pt;border-radius:4pt;width:0.95in;height:0.95in;flex:none}
.qr img{width:100%;height:100%;display:block}
.facts{font-size:13pt;line-height:1.12;letter-spacing:.5pt}
.facts .y{color:#FFD24A;font-size:16pt}
.made{margin-top:auto;text-align:center;font-size:12pt;letter-spacing:5pt}
</style></head>
<body>
<div class="safe">
  <div class="brand">CALLE NUEVE</div>
  <h1><span class="a">PLAY</span><span class="b">DOMINOES</span><span class="c">ANYWHERE</span></h1>
  <div class="sub">The Cuban game, in a deck of cards.</div>
  <div class="art">
    <img class="box" src="src/box-front.png" alt="">
    <div class="card c1"><img src="src/card-b.png" alt=""></div>
    <div class="card c2"><img src="src/card-99.png" alt=""></div>
  </div>
  <div class="foot">
    <div class="qr"><img src="src/qr-play.svg" alt=""></div>
    <div class="facts">
      <div class="y">EVERY CARD IS A DOMINO TILE</div>
      55 CARDS · 0-0 TO 9-9 · 2-4 PLAYERS<br>
      FITS IN A POCKET. PLAYS ON THE BEACH.<br>
      SCAN TO LEARN IN 2 MINUTES
    </div>
  </div>
  <div class="made">MADE IN MIAMI</div>
</div>
</body></html>
