             M 500 446 m -62 0 a 62 62 0 1 0 124 0 a 62 62 0 1 0 -124 0
             M 272 556 L 728 556 L 728 598 L 272 598 Z"/>
    <!-- railing -->
    <rect x="140" y="662" width="720" height="18"/>
    <rect x="140" y="680" width="16" height="66"/>
    <rect x="318" y="680" width="16" height="66"/>
    <rect x="492" y="680" width="16" height="66"/>
    <rect x="666" y="680" width="16" height="66"/>
    <rect x="844" y="680" width="16" height="66"/>
    <!-- deck -->
    <rect x="120" y="740" width="760" height="34"/>
    <!-- stilts -->
    <rect x="252" y="774" width="36" height="140"/>
    <rect x="712" y="774" width="36" height="140"/>
    <!-- cross brace -->
    <path d="M 288 782 L 712 898 L 712 914 L 288 798 Z"/>
    <path d="M 712 782 L 288 898 L 288 914 L 712 798 Z"/>
    <!-- ramp on the left with a rail -->
    <path d="M 120 774 L 252 774 L 252 806 L 70 914 L 30 914 Z"/>
    <path d="M 128 700 L 146 700 L 146 774 L 128 774 Z"/>
    <path d="M 60 800 L 76 800 L 76 914 L 60 914 Z"/>
    <path d="M 128 700 L 146 700 L 76 812 L 60 800 Z"/>
    <!-- ground line -->
